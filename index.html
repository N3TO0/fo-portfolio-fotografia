<!doctype html>
<html lang="pt-br" class="tema-dark">
  
  <head>
    <link rel="stylesheet" href="style/style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.png" />
    <title>Fo Fotografia</title>
  </head>

  <body>
    <header class="menu-select menu-hidden">
      <button class="button-menu">
        <img
          class="img-menu"
          src="src/icon/icon-menu-white.png"
          alt="icone de menu"
        />
      </button>

      <a href="#home"
        ><img
          class="logo-header"
          src="src/img/logo-white.png"
          alt="logo da Fo Fotografia"
      /></a>

      <nav>
        <ul>
          <li><a href="#">PROFISSIONAL</a></li>
          <li><a href="#">PORTFÓLIO</a></li>
          <li><a href="#">SERVIÇOS</a></li>
          <li><a href="#">CONTATOS</a></li>
        </ul>
      </nav>

      <button class="mode-button">
        <img
          class="icon-mode"
          src="src/icon/icon-dark-mode.png"
          alt="icone de tema luz"
        />
      </button>
    </header>
    <main>
      <section id="home">
        <div class="home-container">
          <picture class="img-banner-home">
            <source
              media="(min-width:1000px)"
              srcset="src/img/banner-home-desktop.png"
            />
            <source
              media="(min-width:500px)"
              srcset="src/img/banner-home-tablet.png"
            />
            <img src="src/img/banner-home-mobile.png" alt="" />
          </picture>
          <picture class="img-content-home">
            <source
              media="(min-width:1000px)"
              srcset="src/img/banner-content-home-desktop.png"
            />
            <source
              media="(min-width:500px)"
              srcset="src/img/banner-content-home-tablet.png"
            />
            <img src="src/img/banner-content-home-mobile.png" alt="" />
          </picture>
          <a href="#" class="buttom-contact-home">Contate-me</a>
        </div>
      </section>

      <!-- <hr /> -->

      <!-- <section></section> -->
    </main>
    
    <footer></footer>

    <script src="script/script.js" defer></script>
    <script src="script/tema.js" defer></script>
  </body>

</html>
